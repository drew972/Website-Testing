<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packing checklist</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #eef3ed;
      color: #172b22;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main {
      max-width: 520px;
      margin: 5vh auto;
      padding: clamp(20px, 5vw, 36px);
      background: white;
      border: 1px solid #d6e2d8;
      border-radius: 20px;
    }
    h1 { margin: 0 0 20px; font: 700 clamp(28px, 7vw, 42px)/1.15 Georgia, serif; }
    form, li, li label { display: flex; align-items: center; gap: 10px; }
    input, button { font: inherit; }
    #item { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid #768b7f; border-radius: 8px; }
    button { cursor: pointer; padding: 8px 12px; border: 1px solid transparent; border-radius: 8px; }
    form button { background: #176045; color: white; }
    form button:hover { background: #124b36; }
    ul { list-style: none; margin: 12px 0 0; padding: 0; }
    li { justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #d6e2d8; }
    li label { min-width: 0; flex: 1; cursor: pointer; }
    li span { overflow-wrap: anywhere; }
    input[type="checkbox"] { width: 19px; height: 19px; flex: none; accent-color: #176045; }
    input:checked + span { color: #52675b; text-decoration: line-through; }
    li button { background: #f1f4f1; color: #274536; }
    li button:hover { background: #e1ebe3; }
    :focus-visible { outline: 3px solid #176045; outline-offset: 3px; }
    #status { margin: 20px 0 0; color: #52675b; }
  </style>
</head>
<body>
  <main>
    <h1>Packing checklist</h1>
    <form>
      <input id="item" aria-label="Item to pack" placeholder="Add an item" required>
      <button>Add</button>
    </form>
    <ul aria-label="Items to pack"></ul>
    <p id="status" role="status"></p>
  </main>
  <script>
    const form = document.querySelector('form');
    const input = document.querySelector('#item');
    const list = document.querySelector('ul');
    const status = document.querySelector('#status');
    const storageKey = 'packing-checklist.items';
    const sampleItems = ['Toothbrush', 'Socks', 'Water bottle'].map((name) => ({
      name,
      packed: false
    }));

    function loadItems() {
      try {
        const items = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(items) && items.every((item) =>
          item && typeof item.name === 'string' && typeof item.packed === 'boolean'
        )) {
          return items;
        }
      } catch {
        // Use the sample items if storage is unavailable or unreadable.
      }
      return sampleItems;
    }

    function saveItems() {
      const items = Array.from(list.children, (row) => ({
        name: row.querySelector('span').textContent,
        packed: row.querySelector('input').checked
      }));
      try {
        localStorage.setItem(storageKey, JSON.stringify(items));
      } catch {
        status.textContent += ' · This browser couldn’t save your changes.';
      }
    }

    function updateCount() {
      const packed = list.querySelectorAll(':checked').length;
      status.textContent = list.children.length
        ? `${packed} of ${list.children.length} packed`
        : 'Your list is empty.';
    }

    function updateAndSave() {
      updateCount();
      saveItems();
    }

    function addItem(name, packed = false) {
      const row = document.createElement('li');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = packed;
      checkbox.addEventListener('change', updateAndSave);

      const text = document.createElement('span');
      text.textContent = name;
      label.append(checkbox, text);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = 'Delete';
      remove.setAttribute('aria-label', `Delete ${name}`);
      remove.addEventListener('click', () => {
        const nextRow = row.nextElementSibling || row.previousElementSibling;
        row.remove();
        updateAndSave();
        (nextRow?.querySelector('button') || input).focus();
      });

      row.append(label, remove);
      list.append(row);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (name) {
        addItem(name);
        updateAndSave();
      }
      input.value = '';
      input.focus();
    });

    for (const { name, packed } of loadItems()) {
      addItem(name, packed);
    }
    updateCount();
  </script>
</body>
</html>
